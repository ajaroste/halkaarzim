name: SPK data, AI and notification sync

on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 10 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:
  push:
    branches: [main, agent/auto-ipo-sync-fix]
    paths:
      - ".github/workflows/data-sync.yml"
      - "data/manual/**"
      - "scripts/update_all.py"
      - "scripts/enrich_ipo_data.py"
      - "scripts/sync_public_calendar.py"
      - "tests/test_enrichment.py"
      - "tests/test_public_calendar_sync.py"

permissions:
  contents: write

concurrency:
  group: halkaarzim-data-sync
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: "."
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
      AI_ENDPOINT: ${{ vars.AI_ENDPOINT }}
      AI_ADMIN_TOKEN: ${{ secrets.AI_ADMIN_TOKEN }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Update official and reviewed public-source data
        run: python scripts/update_all.py
        env:
          ALLOW_NETWORK_SYNC: "true"
          PUBLIC_CALENDAR_REQUIRED: "true"
          PUBLIC_CALENDAR_MIN_MATCHES: "3"
          PUBLIC_CALENDAR_DEBUG: "true"

      - name: Generate source-bound AI reports when configured
        run: python scripts/generate_ai_reports.py
        env:
          ENABLE_AI_GENERATION: ${{ env.AI_ADMIN_TOKEN != '' && env.AI_ENDPOINT != '' }}
          AI_MAX_ITEMS: "5"
          AI_REQUIRED: "false"

      - name: Generate social and newsletter content pack
        run: python scripts/generate_growth_content.py

      - name: Run Python validation
        run: python -m unittest tests.test_spk_parser tests.test_enrichment tests.test_public_calendar_sync tests.test_document_ingestion tests.test_document_facts tests.test_ai_generation tests.test_growth_content

      - name: Sync Supabase when configured
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: python scripts/sync_supabase.py
        env:
          ENABLE_NOTIFICATION_ENQUEUE: "true"

      - name: Send free Web Push notifications
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' && env.VAPID_PRIVATE_KEY != '' }}
        run: python scripts/send_notifications.py

      - name: Send Telegram channel update when configured
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != '' }}
        run: python scripts/send_telegram_updates.py
        env:
          TELEGRAM_MAX_MESSAGES: "2"

      - name: Commit updated snapshots and content pack
        run: |
          if git diff --quiet -- data/generated content/generated; then
            echo "No data or content change"
            exit 0
          fi
          git config user.name "halkaarzim-data-bot"
          git config user.email "halkaarzim-data-bot@users.noreply.github.com"
          git add data/generated content/generated
          git commit -m "data: update IPO snapshots and growth content"
          git push
