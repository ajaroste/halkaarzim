name: Import HalkaArzim source v2

on:
  push:
    paths:
      - ".github/workflows/bootstrap-import-v2.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate, rebuild and extract source archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .bootstrap2 -maxdepth 1 -name 'chunk_*' | wc -l)" -eq 9
          cat .bootstrap2/chunk_* > /tmp/source.tar.xz.b64
          base64 --decode /tmp/source.tar.xz.b64 > /tmp/source.tar.xz
          xz --test /tmp/source.tar.xz
          tar -xJf /tmp/source.tar.xz -C .
          rm -rf .bootstrap .bootstrap2
          rm -f .github/workflows/bootstrap-import.yml
          rm -f .github/workflows/bootstrap-import-v2.yml

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: import HalkaArzim v1.0.0 RC3"
          git push origin HEAD:main
