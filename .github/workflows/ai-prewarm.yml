name: Prewarm HalkaArz AI analyses

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ai-prewarm.yml"
      - "data/generated/ipos.json"
      - "data/verified-overrides.json"
      - "data/carryover-ipos.json"
      - "data/ipos.ts"

permissions:
  contents: read

jobs:
  prewarm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for production deployment
        run: sleep 30
      - name: Discover IPO pages and create missing AI analyses
        env:
          BASE_URL: https://halkaarzim.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          sitemap="$(curl --fail --silent --show-error --retry 3 "$BASE_URL/sitemap.xml")"
          mapfile -t slugs < <(printf '%s' "$sitemap" | grep -oE '<loc>[^<]+/arz/[^<]+</loc>' | sed -E 's#.*\/arz\/([^<]+)</loc>#\1#' | sort -u)
          if [ "${#slugs[@]}" -eq 0 ]; then
            echo "No IPO slugs discovered from sitemap"
            exit 1
          fi

          echo "Checking ${#slugs[@]} IPO analyses; persisted analyses will not be regenerated"
          failed=0
          passed=0
          for slug in "${slugs[@]}"; do
            url="$BASE_URL/api/ai/ipo/$slug"
            echo "::group::$slug"
            status="$(curl --silent --show-error --retry 2 --max-time 35 -o /tmp/ai.json -w '%{http_code}' "$url" || true)"
            if [ "$status" != "200" ]; then
              echo "AI analysis check failed: HTTP $status"
              cat /tmp/ai.json 2>/dev/null || true
              failed=$((failed + 1))
            elif python3 -c "import json; d=json.load(open('/tmp/ai.json', encoding='utf-8')); assert d.get('provider') == 'google-gemini'; assert isinstance(d.get('summary'), str) and d['summary'].strip(); print('OK model=%s confidence=%s summary_chars=%s' % (d.get('model'), d.get('confidence'), len(d.get('summary',''))))"; then
              passed=$((passed + 1))
            else
              echo "AI response validation failed"
              cat /tmp/ai.json 2>/dev/null || true
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
            sleep 1
          done

          echo "AI_PREWARM_RESULT passed=$passed failed=$failed total=${#slugs[@]}"
          if [ "$failed" -gt 0 ]; then
            exit 1
          fi
