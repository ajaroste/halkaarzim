name: Build, security and browser tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: halkaarzim-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: npm ci --no-audit --no-fund
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run test:parser
      - run: npm run test
      - run: npm run test:contracts
      - run: npm run test:security
      - run: npm run typecheck
      - run: npm run test:source
      - run: npm run build
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/build_qa_site.py
      - name: Browser QA
        run: |
          python -m http.server 8765 --directory qa-site > /tmp/qa-http.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          sleep 2
          python tests/e2e_qa.py
